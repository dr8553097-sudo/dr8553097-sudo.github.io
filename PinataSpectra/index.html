<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PinataSpectra Sovereign — Enterprise Documentation & Wiki</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Next-Gen 3D Boss & Multi-Tier Piñata Event Engine for Minecraft Paper/Purpur 1.20 - 1.26+. Enterprise Documentation Portal.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/dr8553097-sudo/PinataSpectra/main/assets/banner.png">

  <!-- Google Fonts: Space Grotesk, Plus Jakarta Sans, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Base Theme Stylesheet -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  
  <!-- KaTeX for Math Equations -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css"/>

  <style>
    :root {
      --bg-canvas: #07050e;
      --bg-surface: #0e0a1b;
      --bg-card: rgba(16, 12, 28, 0.82);
      --bg-card-hover: rgba(26, 19, 44, 0.92);
      --border-color: rgba(168, 85, 247, 0.22);
      --border-glow: rgba(0, 240, 255, 0.4);
      --primary: #a855f7;
      --primary-bright: #c084fc;
      --primary-glow: rgba(168, 85, 247, 0.35);
      --secondary: #00f0ff;
      --secondary-glow: rgba(0, 240, 255, 0.28);
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.25);
      --amber: #f59e0b;
      --amber-glow: rgba(245, 158, 11, 0.25);
      --rose: #f43f5e;
      --rose-glow: rgba(244, 63, 94, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --code-bg: #0c081a;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-heading: 'Space Grotesk', var(--font-sans);
      --font-mono: 'JetBrains Mono', monospace;
      
      /* docsify-tabs vars */
      --docsifytabs-border-color: var(--border-color);
      --docsifytabs-tab-background: rgba(14, 10, 27, 0.7);
      --docsifytabs-tab-background--active: rgba(168, 85, 247, 0.15);
      --docsifytabs-tab-color: var(--text-muted);
      --docsifytabs-tab-color--active: var(--secondary);
      --docsifytabs-tab-highlight-color: var(--secondary);
      --docsifytabs-tab-padding: 8px 18px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      color-scheme: dark;
    }

    body {
      background-color: var(--bg-canvas) !important;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 15.5px;
      line-height: 1.75;
      background-image: 
        radial-gradient(circle at 12% 8%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 88% 55%, rgba(0, 240, 255, 0.1) 0%, transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(16, 185, 129, 0.08) 0%, transparent 35%);
      background-attachment: fixed;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #080512;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(168, 85, 247, 0.35);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary);
    }

    /* Scroll Progress Bar */
    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #a855f7, #00f0ff, #10b981);
      z-index: 9999;
      width: 0%;
      transition: width 0.1s ease;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.8);
    }

    /* Top Floating Utility Bar */
    .top-nav-bar {
      position: fixed;
      top: 0;
      right: 0;
      left: 310px;
      height: 52px;
      background: rgba(11, 8, 22, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 32px;
      gap: 16px;
    }

    .top-nav-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none !important;
      padding: 6px 12px;
      border-radius: 8px;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .top-nav-link:hover {
      color: #00f0ff !important;
      background: rgba(0, 240, 255, 0.08);
      border-color: rgba(0, 240, 255, 0.3);
    }

    .top-nav-badge-pro {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.25), rgba(0, 240, 255, 0.15));
      border: 1px solid rgba(168, 85, 247, 0.5);
      color: #c084fc;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-family: var(--font-mono);
      font-weight: 700;
    }

    @media screen and (max-width: 768px) {
      .top-nav-bar {
        left: 0;
        padding: 0 16px;
      }
    }

    /* Sidebar Customization */
    .sidebar {
      background-color: rgba(11, 8, 22, 0.94) !important;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--border-color) !important;
      padding: 24px 18px !important;
      width: 310px !important;
    }

    .sidebar-nav {
      padding-left: 0 !important;
      padding-bottom: 40px;
    }

    .sidebar-nav ul {
      list-style: none !important;
      padding-left: 0 !important;
      margin: 0 !important;
    }

    .sidebar-nav ul ul {
      padding-left: 8px !important;
      margin-bottom: 12px !important;
    }

    .sidebar-nav li {
      list-style: none !important;
      margin: 0 !important;
    }

    .sidebar-nav strong {
      display: block;
      font-family: var(--font-heading);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary-bright);
      margin-top: 18px;
      margin-bottom: 6px;
      padding-left: 8px;
    }

    .sidebar-nav ul li a {
      color: var(--text-muted) !important;
      font-size: 14px;
      font-weight: 500;
      padding: 7px 14px !important;
      border-radius: 8px;
      margin: 2px 0;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar-nav ul li.active > a, .sidebar-nav ul li a:hover {
      color: #00f0ff !important;
      background: rgba(0, 240, 255, 0.1) !important;
      font-weight: 700;
      transform: translateX(4px);
      box-shadow: inset 3px 0 0 0 #00f0ff;
    }

    /* Content Area */
    .content {
      padding-top: 60px !important;
      left: 310px !important;
    }

    .markdown-section {
      max-width: 980px !important;
      padding: 30px 48px 90px 48px !important;
    }

    h1, h2, h3, h4, h5 {
      font-family: var(--font-heading) !important;
      letter-spacing: -0.02em;
      color: #ffffff !important;
      font-weight: 700;
    }

    h1 {
      font-size: 2.35rem !important;
      border-bottom: 1px solid var(--border-color) !important;
      padding-bottom: 14px;
      margin-top: 15px;
      background: linear-gradient(135deg, #ffffff 40%, var(--primary-bright) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h2 {
      font-size: 1.65rem !important;
      margin-top: 42px !important;
      border-bottom: 1px dashed rgba(168, 85, 247, 0.25);
      padding-bottom: 8px;
    }

    h3 {
      font-size: 1.25rem !important;
      color: #e0e7ff !important;
      margin-top: 28px !important;
    }

    hr {
      border: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(168, 85, 247, 0.4), transparent);
      margin: 32px 0;
    }

    /* Code Blocks */
    pre {
      background: var(--code-bg) !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 12px !important;
      padding: 18px 22px !important;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5) !important;
      position: relative;
    }

    pre code {
      font-family: var(--font-mono) !important;
      font-size: 13.8px !important;
      line-height: 1.68 !important;
    }

    :not(pre) > code {
      background: rgba(168, 85, 247, 0.16) !important;
      color: #c084fc !important;
      padding: 2.5px 8px !important;
      border-radius: 6px !important;
      border: 1px solid rgba(168, 85, 247, 0.35) !important;
      font-family: var(--font-mono) !important;
      font-size: 0.9em !important;
    }

    /* Modern Glowing Callouts */
    .custom-callout {
      margin: 24px 0;
      padding: 16px 22px;
      border-radius: 12px;
      border-left: 4px solid var(--primary);
      background: rgba(18, 14, 32, 0.85);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      position: relative;
    }
    .custom-callout .callout-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-heading);
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .custom-callout .callout-content p {
      margin: 0;
      color: #e2e8f0;
      line-height: 1.65;
    }
    .callout-note {
      border-left-color: #00f0ff !important;
      background: rgba(0, 240, 255, 0.08) !important;
      border: 1px solid rgba(0, 240, 255, 0.25);
    }
    .callout-note .callout-header { color: #00f0ff; }

    .callout-tip {
      border-left-color: #10b981 !important;
      background: rgba(16, 185, 129, 0.08) !important;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .callout-tip .callout-header { color: #10b981; }

    .callout-important {
      border-left-color: #a855f7 !important;
      background: rgba(168, 85, 247, 0.08) !important;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }
    .callout-important .callout-header { color: #c084fc; }

    .callout-warning {
      border-left-color: #f59e0b !important;
      background: rgba(245, 158, 11, 0.08) !important;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .callout-warning .callout-header { color: #fbbf24; }

    .callout-caution {
      border-left-color: #f43f5e !important;
      background: rgba(244, 63, 94, 0.08) !important;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }
    .callout-caution .callout-header { color: #fb7185; }

    /* Tables */
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 26px 0;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 6px 24px rgba(0,0,0,0.3);
      background: rgba(14, 10, 26, 0.65);
    }

    th {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(0, 240, 255, 0.15)) !important;
      color: #ffffff !important;
      padding: 14px 18px;
      font-weight: 700;
      text-align: left;
      font-family: var(--font-heading);
      letter-spacing: 0.3px;
    }

    td {
      padding: 12px 18px;
      border-top: 1px solid rgba(168, 85, 247, 0.15);
      color: #cbd5e1;
    }

    tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }

    tr:hover {
      background: rgba(168, 85, 247, 0.06);
    }

    /* Search Bar */
    .search {
      padding: 0 0 16px 0 !important;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .search input {
      background: #140e28 !important;
      border: 1px solid var(--border-color) !important;
      color: #ffffff !important;
      border-radius: 10px !important;
      padding: 10px 16px !important;
      font-family: var(--font-sans) !important;
      font-size: 13.5px !important;
      transition: all 0.3s ease;
    }

    .search input:focus {
      border-color: var(--secondary) !important;
      box-shadow: 0 0 14px var(--secondary-glow) !important;
    }

    /* Pagination Footer Buttons */
    .pagination-item {
      margin-top: 45px !important;
      border: 1px solid var(--border-color) !important;
      background: rgba(18, 13, 34, 0.9) !important;
      backdrop-filter: blur(12px);
      border-radius: 14px !important;
      padding: 16px 24px !important;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3) !important;
    }

    .pagination-item:hover {
      border-color: var(--secondary) !important;
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(0, 240, 255, 0.25) !important;
    }

    .pagination-item-title {
      color: #00f0ff !important;
      font-weight: 700 !important;
      font-size: 1.05rem !important;
      font-family: var(--font-heading) !important;
    }

    .pagination-item-label {
      color: var(--text-muted) !important;
      font-size: 0.8rem !important;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Copy button */
    .docsify-copy-code-button {
      background: rgba(168, 85, 247, 0.25) !important;
      color: #ffffff !important;
      border-radius: 6px !important;
      font-family: var(--font-mono) !important;
      font-size: 12px !important;
      padding: 4px 10px !important;
      border: 1px solid rgba(168, 85, 247, 0.4) !important;
      transition: all 0.2s ease;
    }

    .docsify-copy-code-button:hover {
      background: var(--primary) !important;
      box-shadow: 0 0 10px var(--primary-glow);
    }

    /* Mermaid Containers */
    .mermaid {
      background: rgba(12, 8, 26, 0.85) !important;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      margin: 24px 0;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      text-align: center;
    }

    /* Feature Grid Boxes */
    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
      margin: 28px 0;
    }

    .feature-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px 24px;
      transition: all 0.3s ease;
    }

    .feature-card:hover {
      border-color: var(--secondary);
      background: var(--bg-card-hover);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0, 240, 255, 0.15);
    }

    .feature-card h4 {
      margin-top: 0;
      color: #00f0ff !important;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div id="progress-bar"></div>
  
  <!-- Top Nav Bar -->
  <div class="top-nav-bar">
    <span class="top-nav-badge-pro">👑 v1.0.0-RELEASE</span>
    <a href="https://github.com/dr8553097-sudo/PinataSpectra" target="_blank" class="top-nav-link">⭐ GitHub</a>
    <a href="#/13-Comparison-and-Editions" class="top-nav-link">⚡ Lite vs Sovereign</a>
    <a href="mailto:dr8553097@gmail.com" class="top-nav-link">💬 Support</a>
  </div>

  <div id="app">Loading PinataSpectra Sovereign Enterprise Wiki...</div>

  <!-- Mermaid.js Core -->
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        darkMode: true,
        background: '#0c081a',
        primaryColor: '#a855f7',
        primaryTextColor: '#ffffff',
        primaryBorderColor: '#a855f7',
        lineColor: '#00f0ff',
        secondaryColor: '#00f0ff',
        tertiaryColor: '#10b981'
      }
    });
  </script>

  <!-- KaTeX Core & Auto-Render -->
  <script src="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/katex@latest/dist/contrib/auto-render.min.js"></script>

  <script>
    window.$docsify = {
      name: 'PinataSpectra Sovereign',
      repo: 'https://github.com/dr8553097-sudo/PinataSpectra',
      homepage: 'Home.md',
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === "mermaid") {
              return '<div class="mermaid">' + code + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      tabs: {
        persist: true,
        sync: true,
        theme: 'classic',
        tabComments: true,
        tabHeadings: true
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 Search Wiki & Guides...',
        noData: '❌ No matching modules found',
        depth: 4
      },
      copyCode: {
        buttonText: '📋 Copy',
        errorText: 'Error',
        successText: '✅ Copied'
      },
      pagination: {
        previousText: '← Previous Module',
        nextText: 'Next Module →',
        crossChapter: true,
        crossChapterText: true
      },
      plugins: [
        function (hook, vm) {
          // 1. Scroll progress bar hook
          hook.ready(function () {
            window.addEventListener('scroll', function () {
              var winScroll = document.body.scrollTop || document.documentElement.scrollTop;
              var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
              var scrolled = (winScroll / height) * 100;
              var bar = document.getElementById('progress-bar');
              if (bar) bar.style.width = scrolled + '%';
            });
          });

          // 2. GitHub-Style Callouts Parser hook
          hook.afterEach(function (html, next) {
            var calloutTypes = {
              'NOTE': { class: 'callout-note', icon: 'ℹ️', title: 'NOTE' },
              'TIP': { class: 'callout-tip', icon: '💡', title: 'TIP' },
              'IMPORTANT': { class: 'callout-important', icon: '💎', title: 'IMPORTANT' },
              'WARNING': { class: 'callout-warning', icon: '⚠️', title: 'WARNING' },
              'CAUTION': { class: 'callout-caution', icon: '🛑', title: 'CAUTION' }
            };

            // Parse blockquotes starting with [!TYPE]
            html = html.replace(/<blockquote>\s*<p>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]([\s\S]*?)<\/p>\s*<\/blockquote>/gi, function (match, type, content) {
              var upper = type.toUpperCase();
              var meta = calloutTypes[upper] || calloutTypes['NOTE'];
              return '<div class="custom-callout ' + meta.class + '">' +
                     '<div class="callout-header"><span class="callout-icon">' + meta.icon + '</span><strong>' + meta.title + '</strong></div>' +
                     '<div class="callout-content"><p>' + content.trim() + '</p></div>' +
                     '</div>';
            });

            next(html);
          });

          // 3. Render Mermaid and Math after each route change
          hook.doneEach(function () {
            if (window.mermaid) {
              mermaid.run({
                querySelector: '.mermaid'
              });
            }
            if (window.renderMathInElement) {
              renderMathInElement(document.querySelector('.markdown-section') || document.body, {
                delimiters: [
                  { left: '$$', right: '$$', display: true },
                  { left: '$', right: '$', display: false }
                ],
                throwOnError: false
              });
            }
          });
        }
      ]
    };
  </script>

  <!-- Docsify Core & Search -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <script src="//cdn.jsdelivr.net/npm/docsify-tabs@1"></script>

  <!-- Prism Syntax Highlighters -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
</body>
